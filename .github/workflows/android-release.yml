name: Build release APK
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/android-release.yml
      - Roadtone-Pleos-preview.zip
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android source
        run: |
          unzip -q Roadtone-Pleos-preview.zip
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -x "$sdkmanager"
          "$sdkmanager" --install "platforms;android-35" "build-tools;34.0.0"
          gradle -p Roadtone-Pleos-preview --no-daemon :app:assembleRelease
      - name: Sign and verify preview APK
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/34.0.0"
          unsigned="Roadtone-Pleos-preview/app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned="$RUNNER_TEMP/roadtone-aligned.apk"
          mkdir -p apk
          export APK_SIGN_PASSWORD="$(openssl rand -hex 16)"
          keytool -genkeypair -keystore "$RUNNER_TEMP/roadtone-preview.p12" -storepass:env APK_SIGN_PASSWORD -keypass:env APK_SIGN_PASSWORD -alias roadtone-preview -keyalg RSA -keysize 2048 -validity 365 -dname "CN=Roadtone Preview"
          "$tools/zipalign" -f 4 "$unsigned" "$aligned"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/roadtone-preview.p12" --ks-pass env:APK_SIGN_PASSWORD --out "apk/Roadtone_Roadtone_release.apk" "$aligned"
          "$tools/apksigner" verify --verbose "apk/Roadtone_Roadtone_release.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Roadtone-release-APK
          path: apk/Roadtone_Roadtone_release.apk
          if-no-files-found: error
